<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel del docente · LIDARA</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E3A78;--dk:#15295A;--red:#E0232E;--red2:#FF5A63;--ink:#1D2B4A;--muted:#55627A;--line:#DCE3F0;--bg:#F4F6FA;--ok:#1E7A4C;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:'Archivo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16.5px}
header{background:#fff;border-bottom:1px solid var(--line)}
header .in{max-width:1000px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
header img{height:32px;display:block}
header a{font-weight:700;text-decoration:none;color:var(--navy);font-size:15px}
main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.k{font-size:12.5px;font-weight:800;letter-spacing:2px;color:var(--red);text-transform:uppercase}
h1{margin:6px 0 6px;font-size:clamp(28px,4vw,40px);color:var(--navy);font-stretch:72%;font-weight:900;line-height:1}
.sub{color:var(--muted);margin:0 0 22px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;letter-spacing:2px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px}
button,.btn{font:inherit;font-weight:800;font-size:15.5px;border:0;border-radius:11px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.navy{background:var(--navy);color:#fff}.line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.msg{margin:10px 0 0;font-weight:700}.bad{color:var(--red)}.ok{color:var(--ok)}
.grp{margin-top:22px}
.grp h2{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--navy);transform:translateY(-2px)}
.card b{color:var(--navy);font-size:17px;line-height:1.25}
.card span{color:var(--muted);font-size:14.5px}
.card i{font-style:normal;margin-top:auto;padding-top:6px;color:var(--red);font-weight:800;font-size:13.5px}
.note{margin-top:22px;color:var(--muted);font-size:14px}
.chg{margin-top:26px}
.chg form{margin-top:10px}
@media (max-width:820px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in"><a href="../"><img src="../logo.png" alt="Lidara"></a><span style="display:flex;gap:18px"><a href="./">← Aula</a><a href="../">⌂ Inicio</a></span></div></header>
<main>
  <div class="k">Solo para el docente</div>
  <h1>Panel del docente</h1>
  <p class="sub">Accesos rápidos a las notas, la encuesta y los certificados del taller. Los datos de los participantes siguen protegidos en tu cuenta de Google: al abrir cada enlace, Google te pedirá iniciar sesión.</p>
  <div class="box" id="lock">
    <form id="f" autocomplete="off"><input id="c" type="password" placeholder="Clave del docente" aria-label="Clave del docente"><button class="navy" type="submit">Abrir panel</button></form>
    <p class="msg" id="m" hidden></p>
  </div>
  <div id="panel" hidden></div>
</main>
<script>
(function(){
  var enc = new TextEncoder(), dec = new TextDecoder(), $ = function(i){ return document.getElementById(i); };
  var CLAVE = null, DATA = null, L = null;
  function b64(t){ var s = atob(t), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function tob64(u){ u = new Uint8Array(u); var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function kek(c, salt, iter, use){ var base = await crypto.subtle.importKey('raw', enc.encode(c), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, [use]); }
  function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function render(){
    $('lock').hidden = true; var P = $('panel'); P.hidden = false; P.replaceChildren();
    DATA.grupos.forEach(function(g){
      var s = el('div', 'grp'); s.appendChild(el('h2', null, g.t)); var gr = el('div', 'grid');
      g.items.forEach(function(it){ var a = el('a', 'card'); a.href = it.u; if (!/^\.|^\//.test(it.u)) { a.target = '_blank'; a.rel = 'noopener'; } a.appendChild(el('b', null, it.t)); a.appendChild(el('span', null, it.d)); a.appendChild(el('i', null, 'Abrir ↗')); gr.appendChild(a); });
      s.appendChild(gr); P.appendChild(s);
    });
    P.appendChild(el('p', 'note', 'Consejo: abre este panel en el navegador donde tienes iniciada la cuenta de Google con la que creaste el examen y la encuesta.'));
    var c = el('div', 'box chg'); c.appendChild(el('b', null, 'Cambiar la clave del panel'));
    var f = el('form'); f.autocomplete = 'off';
    var n1 = el('input'); n1.type = 'password'; n1.placeholder = 'Clave nueva (mín. 4 caracteres)';
    var n2 = el('input'); n2.type = 'password'; n2.placeholder = 'Repite la clave nueva';
    var bt = el('button', 'line', 'Generar docente.json'); bt.type = 'submit';
    f.appendChild(n1); f.appendChild(n2); f.appendChild(bt); c.appendChild(f);
    var mm = el('p', 'msg'); mm.hidden = true; c.appendChild(mm);
    f.addEventListener('submit', async function(e){
      e.preventDefault(); mm.hidden = false;
      if (n1.value.length < 4) { mm.className = 'msg bad'; mm.textContent = 'La clave nueva debe tener al menos 4 caracteres.'; return; }
      if (n1.value !== n2.value) { mm.className = 'msg bad'; mm.textContent = 'Las claves no coinciden.'; return; }
      var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      var k = await kek(n1.value, salt, L.iter, 'encrypt');
      var ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv, additionalData:enc.encode('lidara-docente')}, k, enc.encode(JSON.stringify(DATA)));
      var out = JSON.stringify({iter:L.iter, salt:tob64(salt), iv:tob64(iv), ct:tob64(ct)});
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], {type:'application/json'})); a.download = 'docente.json'; document.body.appendChild(a); a.click(); a.remove();
      mm.className = 'msg ok'; mm.textContent = 'Listo: se descargó docente.json. Súbelo a GitHub en taller → aula (reemplaza al anterior). Desde ese momento solo funcionará la clave nueva.';
    });
    P.appendChild(c);
  }
  $('f').addEventListener('submit', async function(e){
    e.preventDefault(); var m = $('m'); m.hidden = false; m.className = 'msg'; m.textContent = 'Comprobando…';
    try {
      L = await (await fetch('aula/docente.json?t=' + Date.now(), {cache:'no-store'})).json();
      var k = await kek($('c').value, b64(L.salt), L.iter, 'decrypt');
      DATA = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(L.iv), additionalData:enc.encode('lidara-docente')}, k, b64(L.ct))));
      m.hidden = true; render();
    } catch(err) { m.className = 'msg bad'; m.textContent = 'Clave incorrecta.'; }
  });
})();
</script>
</body>
</html>
