<style>

*{box-sizing:border-box}
body{margin:0;background:#F4F6FA;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
header{background:var(--navy);color:#fff;padding:22px 16px}
header .in,main{max-width:640px;margin:0 auto}
.brand{font-weight:900;font-size:26px;letter-spacing:1px}.brand span{color:#FF5A63}
header p{margin:4px 0 0;color:#C9D6F0;font-size:15px}
main{padding:20px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.seal{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.5px;padding:6px 12px;border-radius:999px;color:#fff;text-transform:uppercase}
.seal.ok{background:var(--ok)}.seal.bad{background:var(--bad)}.seal.warn{background:#9A6700}
.name{font-size:22px;font-weight:800;margin:14px 0 10px;color:var(--navy)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:14px}dd{margin:0;font-weight:700;font-size:15px}
dd.code{font-family:Consolas,monospace;letter-spacing:.5px}
.msg{color:var(--muted);font-size:14px;margin:14px 0 0}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:200px;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;text-transform:uppercase}
button,.btn{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--navy)}
label{display:block;font-weight:700;margin-bottom:8px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
</style>
</head>

  <div class="card" id="out"><p class="msg" style="margin:0">Escanee el código QR del certificado o escriba su código.</p></div>
  <div class="card">
    <form id="f"><label for="c" style="width:100%">Código del certificado</label><input id="c" placeholder="Ej.: DRG-2026-001-ABCD" autocomplete="off"><button type="submit">Verificar</button></form>
  </div>
</main>
<footer>LIDARA · Asesoría y capacitación farmacéutica · WhatsApp 917 580 401</footer>
